<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Pop! Jelly PangPang</title>
<meta property="og:title" content="Pop! Jelly PangPang">
<meta property="og:image" content="https://jellypangpang1231.github.io/og2.png">
<link rel="icon" href="../favicon.ico">
<!-- C-1908 설치 주소: QR 과 소개 링크가 여는 곳. 아이폰·아이패드는 App Store, 안드로이드는 Google Play, 그 밖(PC)은 홈페이지 첫 화면으로 보낸다.
     ?s= 꼬리표는 홈페이지와 같은 방식으로 스토어에 넘긴다. 앱 안 브라우저(카카오톡·인스타·유튜브 등)에서도 열리게 안드로이드는 마켓 intent 를 쓴다.
     자동 이동이 막히면 스토어 배지 단추가 보인다. -->
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#ffe9f2 0%,#fff6dc 60%,#e6f6ff 100%);color:#5b3a1e;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:420px;margin:0 auto;padding:40px 18px;text-align:center}
.icon{width:96px;height:96px;border-radius:22px;box-shadow:0 4px 0 #e8b9c9}
h1{font-size:22px;margin:14px 0 18px}
.st{display:block;margin:10px auto}
.st img{height:64px;max-width:100%}
#gp img{height:94px;margin:-15px 0}
#more{visibility:hidden}
#more.on{visibility:visible}
a.home{display:inline-block;margin-top:14px;color:#c4561c;font-size:15px}
</style>
</head>
<body>
<main>
<img class="icon" src="../icon-192.png" width="96" height="96" alt="">
<h1>Pop! Jelly PangPang</h1>
<div id="more" class="on">
<a class="st" id="as" href="https://apps.apple.com/app/id6817233245" rel="noopener"><img id="asi" src="../badges/as-en.svg" alt="App Store"></a>
<a class="st" id="gp" href="https://play.google.com/store/apps/details?id=com.jellypangpang.game" rel="noopener"><img id="gpi" src="../badges/gp-en.png" alt="Google Play"></a>
<a class="home" id="home" href="../">jellypangpang1231.github.io</a>
</div>
</main>
<script>
(function () {
  var PKG = 'com.jellypangpang.game';
  var PLAY = 'https://play.google.com/store/apps/details?id=' + PKG;
  var APP = 'https://apps.apple.com/app/id6817233245', APPLE_PT = '';   /* 홈페이지 CFG.applePt 와 같게(비어 있으면 ct 꼬리표 없이 보낸다) */
  var q = new URLSearchParams(location.search);
  var src = (q.get('s') || '').toLowerCase().replace(/[^a-z0-9_]/g, '').slice(0, 24);
  var ref = src ? 'utm_source=' + src + '&utm_medium=social&utm_campaign=launch' : '';
  var playWeb = PLAY + (ref ? '&referrer=' + encodeURIComponent(ref) : '');
  var appUrl = APP + (src && APPLE_PT ? '?pt=' + encodeURIComponent(APPLE_PT) + '&ct=' + encodeURIComponent(src + '_launch') + '&mt=8' : '');
  var market = 'intent://details?id=' + PKG + (ref ? '&referrer=' + encodeURIComponent(ref) : '') +
    '#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=' + encodeURIComponent(playWeb) + ';end';

  var L = ['ko','en','ja','zh-Hant','zh-Hans','ru','ar','es','fr','it','de','pt','tr'], lg = 'en';
  try {
    var ls = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
    for (var i = 0; i < ls.length; i++) { var l = String(ls[i] || '');
      if (/^zh/i.test(l)) { lg = /TW|HK|MO|Hant/i.test(l) ? 'zh-Hant' : 'zh-Hans'; break; }
      var b = l.slice(0, 2).toLowerCase(); if (L.indexOf(b) >= 0) { lg = b; break; } }
  } catch (e) {}
  var bl = lg === 'tr' ? 'en' : lg;
  document.getElementById('asi').src = '../badges/as-' + bl + '.svg';
  document.getElementById('gpi').src = '../badges/gp-' + bl + '.png';

  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && (navigator.maxTouchPoints || 0) > 1);
  var isAnd = !isIOS && /Android/i.test(ua);
  var os = (q.get('os') || '').toLowerCase();                         /* 확인용 ?os=ios|android|pc */
  if (os === 'ios' || os === 'android' || os === 'pc') { isIOS = os === 'ios'; isAnd = os === 'android'; }

  var home = '../' + (src ? '?s=' + encodeURIComponent(src) : '');
  document.getElementById('home').href = home;
  document.getElementById('as').href = appUrl;
  document.getElementById('gp').href = playWeb;                      /* 손으로 누르는 단추는 웹 주소(앱 안 브라우저가 intent 를 막을 때의 예비) */
  document.getElementById('as').hidden = isAnd;
  document.getElementById('gp').hidden = isIOS;

  var to = isIOS ? appUrl : isAnd ? market : home;
  window.__jppGo = to;
  if (q.get('stay') === '1') return;                                  /* 확인용: 이동하지 않고 갈 곳만 보인다 */
  location.replace(to);
})();
</script>
</body>
</html>
